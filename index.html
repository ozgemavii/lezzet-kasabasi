.portion{border:0;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:.8rem;border-radius:999px;padding:4px 10px;margin:0 0 4px}
.x{border:0;background:none;color:var(--muted);font-size:1.4rem;width:36px;height:36px;border-radius:50%;flex:0 0 auto}
.alts{display:flex;flex-wrap:wrap;gap:8px;padding:4px 8px 8px 0}
.add{align-items:center}
.add .chip{flex:0 0 auto}
.total{text-align:center;padding:18px;border-radius:28px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:0 14px 34px rgba(46,107,255,.28)}
.total .big{font-size:3.6rem;font-weight:800;line-height:1}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line)}
th{font-size:.78rem;color:var(--muted);font-weight:600;border-top:0}
td.n,th.n{text-align:right;white-space:nowrap}
.src{display:inline-block;font-size:.68rem;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle}
.src.ok{background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--ink)}
.src.est{background:color-mix(in srgb,var(--sun) 28%,transparent);color:var(--ink)}
.adj td{color:var(--muted);font-size:.86rem}
.swap{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.swap:first-of-type{border-top:0}
.save{margin-left:auto;font-weight:800;color:var(--mint);white-space:nowrap}
.warn{border:2px solid var(--coral)}
.warn h3{color:var(--coral)}
.bullets{margin:0;padding-left:20px}
.bullets li{margin:4px 0}
.skel{height:14px;border-radius:8px;background:var(--line);margin:8px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* recipes */
.steps{margin:0;padding-left:22px}
.steps li{margin:8px 0}
.idea{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:20px;padding:14px;color:var(--ink);margin-top:10px;box-shadow:var(--shadow)}
.idea b{display:block;font-size:1.05rem}
.kcal-pill{display:inline-block;font-weight:800;font-size:.85rem;padding:4px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.rec-head{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.fridge{display:flex;align-items:center;gap:12px;width:100%;border:2px dashed var(--sky);background:color-mix(in srgb,var(--sky) 10%,var(--surface));color:var(--ink);border-radius:20px;padding:14px;text-align:left;font-weight:700}
.fridge span{font-size:2rem}

/* wheel */
.wheel-wrap{position:relative;width:min(320px,86vw);margin:10px auto 0}
.wheel-wrap svg{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 24px rgba(15,27,61,.18))}
#wheelG{transform-origin:160px 160px;transform-box:view-box}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);z-index:2}
.win{text-align:center;border-radius:28px;padding:20px;background:var(--surface);box-shadow:var(--shadow)}
.win .e{font-size:3.4rem;line-height:1}

/* community */
.post{background:var(--surface);border-radius:24px;overflow:hidden;margin-top:14px;box-shadow:var(--shadow)}
.post-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--blue-soft)}
.post .art{aspect-ratio:4/3;display:grid;place-items:center;font-size:4.5rem;background:linear-gradient(140deg,var(--blue-soft),color-mix(in srgb,var(--sun) 25%,var(--surface)))}
.post-body{padding:12px 14px 14px}
.post-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.like{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.like[aria-pressed="true"]{background:color-mix(in srgb,var(--coral) 18%,transparent);border-color:var(--coral)}

/* progress */
.chart{width:100%;height:auto;display:block}
.range{font-size:1.6rem;font-weight:800;line-height:1.1}

/* paywall */
.price{font-size:2.6rem;font-weight:800;line-height:1}
.feat{list-style:none;padding:0;margin:12px 0}
.feat li{padding:7px 0 7px 32px;position:relative}
.feat li::before{content:"✓";position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;font-size:.8rem;font-weight:800;display:grid;place-items:center}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -6px 24px rgba(15,27,61,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:460px;margin:0 auto;display:flex;padding:6px 6px 0}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-weight:700;font-size:.74rem;border-radius:16px}
.tab svg{width:23px;height:23px;display:block;margin:0 auto 3px}
.tab[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
/* v4 additions */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,34,.55);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:24px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}

.verdict{font-size:.74rem;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.v-great{background:color-mix(in srgb,var(--mint) 24%,transparent)}

.grade{font-size:3.2rem;font-weight:800;line-height:1}

.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 8px;margin:2px 4px 0 0}

.bigin{font-size:1.4rem;font-weight:800;text-align:center}

.giftbox{font-size:5rem;display:inline-block;animation:shake .5s ease-in-out infinite}

.gprev{background:linear-gradient(160deg,var(--blue-soft),color-mix(in srgb,var(--coral) 12%,var(--surface)));border-radius:16px;display:flex;justify-content:center;align-items:flex-end;height:132px;overflow:hidden}

.kc-card,.ava-card{display:flex;gap:14px;align-items:center;width:100%;border:0;color:var(--ink);cursor:pointer}

.tab.pulse{animation:tpulse 1s ease-in-out infinite;color:var(--blue);background:var(--blue-soft)}
@keyframes tpulse{50%{transform:translateY(-6px)}}
.modal-bg.tour{align-items:start;padding-top:12vh}

.ran-dance{animation:rDb 1.2s ease-in-out infinite}.ran-dance .rArmL{animation:rDl 1.2s ease-in-out infinite}.ran-dance .rArmR{animation:rDr 1.2s ease-in-out infinite}.ran-dance .rLegL{animation:rDll 1.2s ease-in-out infinite}.ran-dance .rLegR{animation:rDlr 1.2s ease-in-out infinite}.ran-dance .rHead{animation:rDh 1.2s ease-in-out infinite}
@keyframes rDb{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,-2px) rotate(-2.5deg)}75%{transform:translate(3px,-2px) rotate(2.5deg)}}

.ran-jump{animation:rJ .9s cubic-bezier(.3,0,.3,1) infinite}@keyframes rJ{0%,100%{transform:translateY(0)}20%{transform:translateY(3px)}50%{transform:translateY(-22px)}80%{transform:translateY(1px)}}

/* ===== Şeftali & Lavanta paleti ===== */
:root{ --bg:#FBF7FF; --surface:#FFFFFF; --ink:#2B2350; --muted:#6E6890; --line:#ECE6F7; --blue:#7B6CF6; --blue-soft:#EFEBFF; --sky:#8FB8FF; --coral:#FF8A7A; --sun:#FFC85C; --mint:#3CCB9A; --lilac:#B39DFF; --on-blue:#FFFFFF; --hero1:#8E7CF0; --hero2:#FF9A8B; --shadow:0 10px 28px rgba(123,108,246,.14); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#17142B; --surface:#221E3B; --ink:#F3EFFF; --muted:#ACA5CC; --line:#352F57; --blue:#A99BFF; --blue-soft:#2D2752; --sky:#9FC2FF; --coral:#FF9E90; --sun:#FFD37A; --mint:#5FDDB3; --lilac:#C6B8FF; --on-blue:#17142B; --hero1:#5E4FC7; --hero2:#C96A62; --shadow:0 10px 28px rgba(0,0,0,.4); } }
:root[data-theme="dark"]{ --bg:#17142B; --surface:#221E3B; --ink:#F3EFFF; --muted:#ACA5CC; --line:#352F57; --blue:#A99BFF; --blue-soft:#2D2752; --sky:#9FC2FF; --coral:#FF9E90; --sun:#FFD37A; --mint:#5FDDB3; --lilac:#C6B8FF; --on-blue:#17142B; --hero1:#5E4FC7; --hero2:#C96A62; --shadow:0 10px 28px rgba(0,0,0,.4); }
body{ background:var(--bg); }
.card{ background:var(--surface); border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.04)!important; }

const norm = s => String(s||"").toLocaleLowerCase("tr").replace(/\(.*?\)/g," ").replace(/[^a-zçğıöşü0-9 ]/g," ").replace(/\s+/g," ").trim();
const FOOD_IDX = FOODS.map(([name,kcal,p,c,f,pl,pg,al])=>({name,kcal,p,c,f,pl,pg,raw:pg===0,terms:[norm(name),...String(al||"").split(",").map(norm).filter(Boolean)]}));
/* mode "cooked": hazır yemek tercih; "raw": tarif malzemesi tercih */
function matchFood(name, mode="cooked"){
  const n = norm(name), rawHint = /çiğ|kuru\b/.test(String(name).toLocaleLowerCase("tr"));
  if(!n) return null;
  let best=null, bestScore=0;
  for(const e of FOOD_IDX){
    for(const t of e.terms){
      let s=0;
      if(n===t) s=100+t.length;
      else if((" "+n+" ").includes(" "+t+" ")) s=t.length*2;
      else if(n.includes(t) && t.length>=4) s=t.length;
      else if(t.includes(n) && n.length>=5) s=n.length*0.8;
      if(!s) continue;
      const wantRaw = mode==="raw" || rawHint;
      if(e.raw===wantRaw) s+=3;
      if(s>bestScore){ bestScore=s; best=e; }
    }
  }
  return best;
}

async function ai(prompt, images, opts={}){
  await waitReady(); lastAiErr=null;
  if (!sample){ lastAiErr="unavailable"; return null; }
  if (navigator.onLine===false){ lastAiErr="offline"; return null; }
  let timedOut=false; const ctrl=new AbortController(); const to=setTimeout(()=>{ timedOut=true; ctrl.abort(); }, opts.timeout||60000);
  try{
    if (images){ const lim = await sample.limits().catch(()=>null); if (!lim || !lim.images){ lastAiErr="unavailable"; return null; } }
    const res = await sample.json(prompt, {...(images?{images}:{}), cache:false, signal:ctrl.signal});
    if (!res || typeof res!=="object"){ lastAiErr="invalid"; return null; }
    return res;
  }catch(e){
    if (timedOut){ lastAiErr="timeout"; return null; }
    if (e && e.code==="cancelled") throw "cancel";
    lastAiErr = e&&e.code==="rate_limited"?"rate": e&&e.code==="not_granted"?"denied": (e instanceof SyntaxError || (e&&e.code==="invalid_json"))?"invalid": navigator.onLine===false?"offline":"failed";
    return null;
  }finally{ clearTimeout(to); }
}

function tdee(p){ const bmr = 10*p.w + 6.25*p.h - 5*p.age + (p.sex==="m"?5:-161); return bmr*(ACT[p.act]||ACT.low)[0]; }
function floorKcal(p){ return p.sex==="m"?1500:1200; }
function target(p){
  if (!p) return 2000;
  const t = tdee(p); let g = p.goal==="lose" ? t-500 : p.goal==="gain" ? t+300 : t;
  if (p.override) g = p.override;
  return Math.max(floorKcal(p), r0(g/10)*10);
}

function streak(){
  const days=new Set([...state.meals.map(m=>dayKey(m.t)),...(state.freezeDays||[])]); let n=0; const d=new Date(); d.setHours(0,0,0,0);

}

/* ================= Today ================= */
function todays(){ const k=dayKey(Date.now()); return state.meals.filter(m=>dayKey(m.t)===k); }
function sum(arr,f){ return arr.reduce((a,m)=>a+(+m[f]||0),0); }
const MEALTYPES=["Kahvaltı","Öğle","Akşam","Ara öğün"];
const MEALEMO={"Kahvaltı":"🍳","Öğle":"🥗","Akşam":"🍲","Ara öğün":"🍎"};
function guessType(){ const h=new Date().getHours(); return h<11?"Kahvaltı":h<16?"Öğle":h<21?"Akşam":"Ara öğün"; }
function todayTarget(){ return target(state.profile)+(state.spend[dayKey(Date.now())]||0); }
function remaining(){ return todayTarget()-sum(todays(),"kcal"); }
function weekStartDate(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function dayEaten(k){ return sum(state.meals.filter(m=>dayKey(m.t)===k),"kcal"); }
/* Haftalık cüzdan: pazartesiden dünkü güne kadar hedefin altında kalınan kalori (günde en fazla 300) birikir; harcananlar düşülür */
function bank(){
  const base=target(state.profile), today=dayKey(Date.now()), d=weekStartDate(); let b=0;
  for(; d.getTime()<today; d.setDate(d.getDate()+1)){ const k=d.getTime(), e=dayEaten(k); if(e>0) b+=Math.min(300, base+(state.spend[k]||0)-e); }
  const ws=weekStartDate().getTime(); for(const k in state.spend){ if(+k>=ws && +k<today) b-=state.spend[k]; }
  return r0(b);
}
function fastInfo(){
  const f=state.fast, now=new Date();
  if(f.plan==="ramadan"){
    const t=s=>{ const [h,m]=String(s||"00:00").split(":").map(Number); const d=new Date(); d.setHours(h,m||0,0,0); return d; };
    let im=t(f.imsak), ift=t(f.iftar), label, to;
    if(now<im){ label="Sahura kalan"; to=im; } else if(now<ift){ label="İftara kalan"; to=ift; } else { label="Yarınki imsaka kalan"; to=new Date(im.getTime()+864e5); }
    return {ramadan:true, label, ms:to-now};
  }
  const hrs=+(f.plan||"16:8").split(":")[0];
  if(f.start) return {ramadan:false, active:true, hrs, ms:Date.now()-f.start};
  return {ramadan:false, active:false, hrs};
}
const hm = ms => { const m=Math.max(0,Math.floor(ms/60000)); return `${Math.floor(m/60)} sa ${m%60} dk`; };
function macroTargets(p, kcal){
  const proPerKg = p.goal==="lose"?1.6: p.goal==="gain"?1.6:1.2;
  const pro = Math.min(r0(p.w*proPerKg), r0(kcal*0.35/4));
  const fat = r0(kcal*0.28/9);
  const carb = Math.max(0, r0((kcal - pro*4 - fat*9)/4));
  return {pro, carb, fat};
}

/* ================= Detect → Confirm → Compute ================= */
const DB_NAMES = FOODS.filter(f=>f[6]>0).map(f=>f[0]).join(", ");
const DETECT_IMG = () => `Ekteki fotoğraf bir yemek tabağı. Tabaktaki her ayrı yiyeceği tanı ve fotoğraftan gerçekçi gramajını tahmin et (tabak çapı ~26 cm kabul et). Mümkünse yiyeceğin adını şu listeden birebir seç: ${DB_NAMES}. Listede yoksa kısa Türkçe adını yaz ve "per100" alanında 100 gram için ortalama kcal, protein, carb, fat ver. Emin değilsen benzer görünen 2-3 alternatif ekle (ör. patates püresi / omlet / humus). Yemek yoksa "is_food": false yap. En fazla 6 yiyecek. Yalnızca JSON döndür:
{"is_food":true,"items":[{"name":"patates püresi","grams":150,"confidence":"low","alternatives":["omlet","humus"],"per100":null}]}
confidence: "high", "medium" veya "low".`;
const DETECT_TXT = t => `Kullanıcı yediklerini şöyle yazdı: "${t}". Her ayrı yiyeceği ayır ve gerçekçi gramajını ver (1 dilim ekmek 30 g, 1 yumurta 50 g, 1 kase çorba 250 g, 1 porsiyon pilav 150 g gibi). Mümkünse adı şu listeden birebir seç: ${DB_NAMES}. Listede yoksa kısa Türkçe adını yaz ve "per100" alanında 100 gram için kcal, protein, carb, fat ver. Yalnızca JSON döndür:
{"is_food":true,"items":[{"name":"menemen","grams":200,"confidence":"high","alternatives":[],"per100":null}]}`;
function demoDetect(text){
  if (text) return {is_food:true, items:text.split(/,|\bve\b/).map(s=>s.trim()).filter(Boolean).slice(0,6).map(n=>{ const m=matchFood(n); return {name:n, grams:m&&m.pg?m.pg:150, confidence:m?"high":"medium", alternatives:[]}; })};
  return {is_food:true, items:[{name:"omlet",grams:120,confidence:"low",alternatives:["patates püresi","humus"]},{name:"ızgara köfte",grams:120,confidence:"high",alternatives:[]},{name:"çoban salata",grams:150,confidence:"medium",alternatives:["yeşil salata","cacık"]}]};
}
function goodPer(p){ return p && +p.kcal>0 && +p.kcal<950 ? {kcal:+p.kcal,p:+p.protein||0,c:+p.carb||0,f:+p.fat||0} : null; }
function parseQty(s){ const m=String(s).match(/^\s*(\d+(?:[.,]\d+)?|yarım|bir|iki|üç)\b/i); if(!m) return null; const w={yarım:0.5,bir:1,iki:2,"üç":3}[m[1].toLocaleLowerCase("tr")]; return w||parseFloat(m[1].replace(",",".")); }
function localParse(text){
  return {items:text.split(/,|\bve\b|\+|\n/).map(s=>s.trim()).filter(Boolean).slice(0,8).map(n=>{ const m=matchFood(n), q=parseQty(n);
    const grams = m&&m.pg ? r0((q||1)*m.pg) : 100; return {name:n, grams, confidence:m?"medium":"low", alternatives:[]}; })};
}
function normItems(list){ return list.slice(0,10).map(i=>({name:String(i.name||"").trim(), grams:Math.min(3000,Math.max(1,r0(i.grams)||100)), low:i.confidence!=="high", alts:(Array.isArray(i.alternatives)?i.alternatives:[]).map(String).filter(Boolean).slice(0,3), per100:goodPer(i.per100), open:false})).filter(i=>i.name); }
const PREP0=()=>({cook:null,oil:"Normal",salt:"Normal",share:"Hepsi"});
const SRC_LABEL={ai:"🤖 Yapay zekâ tanıdı", local:"📗 Yerel besin tablosuyla eşleşti", manual:"✍️ Elle giriş", demo:"⚠️ ÖRNEK VERİ – senin fotoğrafından analiz edilmedi"};
async function detect(text){

  thinking(text?"Yazdıklarını anlıyorum":"Tabağındakileri tanıyorum","Birazdan kontrol edip düzeltebileceksin.");
  let r=null;
  try{ r = await ai(text?DETECT_TXT(text):DETECT_IMG(), text?null:[lastPhoto], {timeout:text?40000:60000}); }catch(e){ return go("today"); }
  const url=lastPhoto?URL.createObjectURL(lastPhoto):null;
  if(r && r.is_food===false){
    if(!text) useQuota("scan");
    return showFail({title:"Bu fotoğrafta yemek göremedim", err:null, url, note:"Tabağı yukarıdan, iyi ışıkta ve tamamı görünecek şekilde çekmeyi dene. Hiçbir kayıt oluşturulmadı.",
      onRetry:()=>detect(), onManual:()=>{ detected={source:"manual",url,items:[],prep:PREP0()}; go("confirm"); }, manualText:"Yemeğimi elle gireyim"});
  }
  let source="ai";
  if(!r || !Array.isArray(r.items) || !r.items.length){
    if(text){ r=localParse(text); source="local"; }
    else return showFail({title:"Fotoğraf analiz edilemedi", err:lastAiErr, url,
      onRetry:()=>detect(), onManual:()=>{ detected={source:"manual",url,items:[],prep:PREP0()}; go("confirm"); }, manualText:"Yemeğimi elle gireyim",
      onDemo:()=>{ detected={source:"demo",url,items:normItems(demoDetect().items),prep:PREP0()}; go("confirm"); }});
  }
  if(!text){ useQuota("scan"); dayInc("photo"); }
  detected={source, text:text||null, url, items:normItems(r.items), prep:PREP0()};
  go("confirm");
}

/* Kalori hesabı: önce yerel besin tablosu (değer × gram). Tabloda yoksa yapay zekâdan 100 g değeri istenir.
   O da yoksa yiyecek "belirsiz" kalır ve kullanıcıdan kalori girmesi istenir; uydurma değer atanmaz. */
const UNKNOWN = names => `Şu yiyeceklerin yenmeye hazır (pişmişse pişmiş) hali için 100 gram başına ortalama besin değerlerini ver: ${names.join("; ")}. Standart besin tablolarıyla uyumlu ol; bir yiyeceği tanımıyorsan onu listeye koyma. Yalnızca JSON döndür: {"foods":[{"name":"","kcal":0,"protein":0,"carb":0,"fat":0}]}`;
function perFor(name, per100){ const m=matchFood(name); if(m) return {per:{kcal:m.kcal,p:m.p,c:m.c,f:m.f}, src:"table", ref:m.name}; if(per100) return {per:per100, src:"ai", ref:null}; return {per:null, src:"unknown", ref:null}; }
function itemFrom(name, grams, info){ const g=Math.max(0,r0(grams));
  if(!info.per) return {name, grams:g, kcal:null, protein:null, carb:null, fat:null, src:info.src, per:null};
  return {name, grams:g, per:info.per, kcal:r0(info.per.kcal*g/100), protein:r1(info.per.p*g/100), carb:r1(info.per.c*g/100), fat:r1(info.per.f*g/100), src:info.src}; }
function recalcItem(it){ if(it.per){ const g=it.grams; it.kcal=r0(it.per.kcal*g/100); it.protein=r1(it.per.p*g/100); it.carb=r1(it.per.c*g/100); it.fat=r1(it.per.f*g/100); } return it; }
function sumItems(items, adj=[]){ const known=items.filter(i=>i.kcal!=null);
  return {total:Math.max(0,r0(sum(known,"kcal")+sum(adj,"kcal"))), protein:r1(sum(known,"protein")), carb:r1(sum(known,"carb")), fat:r1(Math.max(0,sum(known,"fat")+sum(adj,"fat"))), unknown:items.filter(i=>i.kcal==null).length}; }
const SRC_TAG={table:["ok","✓ tablo"], ai:["est","≈ YZ tahmini"], user:["est","✍️ senin girdiğin"], unknown:["est","? belirsiz"]};
function adjFor(items, prep, sf){
  const adj=[], cooked=prep.cook&&prep.cook!=="Çiğ";
  if(prep.oil==="Bol"&&cooked) adj.push({name:"Ek yağ: bol (~1 yemek kaşığı)",kcal:r0(90*sf),fat:r1(10*sf)});
  if(prep.oil==="Az"&&cooked) adj.push({name:"Az yağ (~yarım kaşık daha az)",kcal:r0(-40*sf),fat:r1(-4.5*sf)});
  if(prep.cook==="Kızartma"){ const g=sum(items.filter(i=>!/kızart|kızarmış/.test(norm(i.name))),"grams"); if(g>0){ const oil=r1(g*0.06); adj.push({name:`Kızartma yağı (~${oil} g emilen)`,kcal:r0(oil*9),fat:oil}); } }
  return adj;
}
async function compute(){
  const d=detected;
  thinking("Kalori hesaplanıyor","Her yiyeceği besin tablosuyla eşleştiriyorum.");
  const sf=SHARE[d.prep.share]||1;
  const rows=d.items.map(i=>({typed:i.name, grams:i.grams*sf, info:perFor(i.name,i.per100)}));
  const unk=rows.filter(r=>r.info.src==="unknown");
  let aiNote=null;
  if(unk.length){
    let r=null; try{ r=await ai(UNKNOWN(unk.map(u=>u.typed)),null,{timeout:30000}); }catch(e){ return go("confirm"); }
    const foods=(r&&Array.isArray(r.foods))?r.foods:[];
    unk.forEach(u=>{ const f=foods.find(x=>norm(x.name)===norm(u.typed)); const p=goodPer(f); if(p) u.info={per:p,src:"ai",ref:null}; });
    if(!r) aiNote=lastAiErr;
  }
  const items=rows.map(r=>({...itemFrom(r.info.ref||r.typed, r.grams, r.info), typed:r.typed}));
  const now=new Date(); now.setSeconds(0,0);
  computed={items, adj:adjFor(items,d.prep,sf), type:guessType(), when:now.getTime(), coach:null, source:d.source, share:d.prep.share, aiNote,
    title: items.slice(0,2).map(i=>i.typed||i.name).join(" ve ")+(items.length>2?" +":"")};
  go("result"); if(d.source!=="demo") loadCoach();
}
const COACH = () => { const c=computed, p=state.profile, S=sumItems(c.items,c.adj), left=remaining()-S.total;
  return `Sen bir beslenme koçusun. ${tone()} Kullanıcının öğünü (kaloriler hesaplandı, değiştirme): ${c.items.map(i=>`${i.name} ${i.grams} g = ${i.kcal==null?"bilinmiyor":i.kcal+" kcal"}`).join("; ")}. Toplam ${S.total} kcal. Tuz: ${detected.prep.salt}. Bu öğünden sonra günün kalan hakkı: ${left} kcal. Hedef: ${GOALS[p.goal]}. ${prefsText()}
Görevlerin: 1) Tek cümlelik, pozitif ve samimi bir yorum. 2) 2-3 daha hafif alternatif: hangi yiyeceğin yerine ne (yalnızca adlar). 3) Kalan hak eksiye düştüyse 2 nazik, pratik öneri; değilse boş liste. 4) Alerji/tercih çakışması varsa kısa uyarı. ${SAFETY}
Türkçe ve kısa yaz. Yalnızca JSON döndür: {"note":"","alternatives":[{"instead":"beyaz pilav","swap":"bulgur pilavı"}],"tips":[],"allergy_warning":""}`; };
async function loadCoach(){
  const myc=computed; let r=null;
  try{ r=await ai(COACH(),null,{timeout:40000}); }catch(e){ r=null; }
  if(computed!==myc) return;
  if(!r){ myc.coach={err:lastAiErr}; if(curScreen==="result") renderCoach(); return; }
  r.alternatives=(Array.isArray(r.alternatives)?r.alternatives:[]).slice(0,3).map(a=>{ const it=myc.items.find(i=>i.kcal!=null&&(norm(i.name)===norm(a.instead)||norm(i.typed)===norm(a.instead))) || myc.items.find(i=>i.kcal!=null&&(norm(i.name).includes(norm(a.instead))||norm(a.instead).includes(norm(i.name))));
    const sw=matchFood(a.swap); let saves=null; if(it&&sw){ saves=it.kcal-r0(sw.kcal*it.grams/100); } return {...a, saves}; });
  myc.coach=r; if(curScreen==="result") renderCoach();
}
function renderCoach(){
  const el=$("#coach"); if(!el) return; const r=computed.coach;
  if(computed.source==="demo"){ el.innerHTML=""; return; }
  if(!r){ el.innerHTML=`<div class="card" style="margin-top:12px"><h3>🤖 Koçun düşünüyor…</h3><div class="skel" style="width:90%"></div><div class="skel" style="width:70%"></div></div>`; return; }
  if(r.err){ el.innerHTML=`<div class="card" style="margin-top:12px"><h3>🤖 Koç önerileri</h3><p class="small muted" style="margin:0">Şu an öneri alınamadı: ${esc(AI_ERR[r.err]||AI_ERR.failed)} Kalori hesabı bundan etkilenmez.</p></div>`; return; }
  const list=a=>(Array.isArray(a)?a:[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("");
  el.innerHTML=`${r.allergy_warning?`<div class="card warn"><h3>⚠️ Dikkat</h3><p style="margin:0">${esc(r.allergy_warning)}</p></div>`:""}
    <div class="card"><h3>🤖 Koçun diyor ki</h3><p style="margin:0">${esc(r.note||"")}</p></div>

function toThumb(file,s=160,q=.7){
  return new Promise(res=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"), k=Math.max(s/img.width,s/img.height); c.width=s; c.height=r0(s*.75);
      c.getContext("2d").drawImage(img,(s-img.width*k)/2,(c.height-img.height*k)/2,img.width*k,img.height*k); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); }; img.src=url; });
}

/* Tarif kalorilerini veritabanıyla yeniden hesapla: AI'ın toplamaları tutarsız olsa bile sonuç tutarlı olur */
function normRecipe(r){
  r.servings=Math.max(1,r0(r.servings)||1); r.steps=(r.steps||[]).map(String);
  r.ingredients=(r.ingredients||[]).map(i=>{
    const g=+i.grams||0, m=g>0?matchFood(i.name,"raw"):null;
    if(m) return {name:String(i.name), amount:String(i.amount||g+" g"), grams:g, kcal:r0(m.kcal*g/100), p:r1(m.p*g/100), c:r1(m.c*g/100), f:r1(m.f*g/100), src:"ok"};
    return {name:String(i.name||""), amount:String(i.amount||""), grams:g, kcal:r0(i.kcal), p:r1(i.protein), c:r1(i.carb), f:r1(i.fat), src:"est"};
  });
  r.total_kcal=sum(r.ingredients,"kcal"); r.kcal_per_serving=r0(r.total_kcal/r.servings);
  r.protein=r1(sum(r.ingredients,"p")/r.servings); r.carb=r1(sum(r.ingredients,"c")/r.servings); r.fat=r1(sum(r.ingredients,"f")/r.servings);
  return r;
}
async function makeRecipe(prompt, fallbackWant){

    else return showFail({title:"Tarif hazırlanamadı", err:lastAiErr||"invalid", back:"recipes", onRetry:()=>makeRecipe(prompt,fallbackWant)});
  } else { useQuota("recipe"); dayInc("recipe"); }
  curRecipe=normRecipe(r); go("recipe");
}

  if(theme==="odul"){ const bk=Math.max(0,bank()); let list=TREATS.filter(d=>dishAllowed(d)&&d.kcal<=bk); if(list.length<4) list=TREATS.filter(dishAllowed).sort((a,b)=>a.kcal-b.kcal).slice(0,6); return {budget:bk, list:shuffle(list).slice(0,8), cat:"odul"}; }
  const left=remaining(); const cat = theme==="auto"?autoCat(): theme==="r"?ramadanCat(): theme;
  const snack = cat==="a"||cat==="t";
  const budget = left>150 ? Math.min(left, snack?350:800) : 250;
  let pool=DISHES.filter(d=>dishAllowed(d) && (cat==="i"||cat==="s"||!d.tags.includes("R")) && (cat==="b" ? d.tags.includes("b") : d.tags.includes(cat)));
  const recent=state.wheelHist||[];
  let fit=pool.filter(d=>d.kcal<=budget*1.05 && !recent.includes(d.name));
  if(fit.length<6) fit=[...new Set([...fit,...pool.filter(d=>!recent.includes(d.name)).sort((a,b)=>a.kcal-b.kcal)])].slice(0,Math.max(6,fit.length));
  if(fit.length<6) fit=pool.slice();
  return {budget, list:shuffle(fit).slice(0,8), cat};
}
const AI_WHEEL = (mode,budget) => `Bir "ne yesem" çarkı için 8 farklı, lezzetli ve sağlıklı Türk/dünya mutfağı öğün önerisi üret. Her biri yaklaşık ${budget} kcal veya altında olsun. ${mode==="pantry"?`Mümkün olduğunca şu malzemeleri kullan: ${pantry.join(", ")}.`:"Sıradan olmayan, şaşırtıcı ama evde yapılabilir fikirler olsun."} Saat ${new Date().getHours()}:00, buna uygun öğünler seç. ${prefsText()}
Her öğünü bileşenlerine ayır ve gramlarını ver; bileşen adlarını mümkünse şu listeden birebir seç: ${DB_NAMES}. Adlar en fazla 22 karakter.
Yalnızca JSON döndür: {"dishes":[{"emoji":"🍲","name":"","kcal":0,"parts":[{"name":"","grams":0}]}]}`;
async function buildWheel(theme){
  if(theme==="pantry" && !pantry.length){ toast("Önce Tarifler › Evdekilerle’den malzeme ekle ya da dolap fotoğrafı çek"); theme="auto"; }
  if(theme==="pantry"||theme==="ai"){
    wheelState={theme, list:[], loading:true, rot:0, win:null}; go("wheel");
    const budget=remaining()>150?Math.min(remaining(),800):300;
    let r=null; try{ r=await ai(AI_WHEEL(theme,budget)); }catch(e){ r=null; }
    let list=(r&&Array.isArray(r.dishes))?r.dishes.slice(0,8).map(d=>buildDish(String(d.emoji||"🍽️").slice(0,4),String(d.name||"Öğün").slice(0,26),"",(d.parts||[]).map(p=>[String(p.name),+p.grams||0]),d.kcal)).filter(d=>d.kcal>0):[];
    let demo=false; if(list.length<4){ list=localWheel("auto").list; demo=true; }
    wheelState={theme, list, budget, rot:0, win:null, demo}; if(curScreen==="wheel") go("wheel"); return;
  }
  const w=localWheel(theme); wheelState={theme, ...w, rot:0, win:null};
}

async function sendCoach(text){
  if(state.chat.some(m=>m.pending)) return;
  if(!canUse("coach")) return go("limit","coach");
  state.chat.push({r:"me",t:text}); const pend={r:"ai",t:"",pending:true}; state.chat.push(pend); go("coach");
  let r=null; try{ r=await ai(COACH_CHAT(text),null,{timeout:45000}); }catch(e){ r=null; lastAiErr="denied"; }
  pend.pending=false;
  if(r&&r.reply){ pend.t=String(r.reply); pend.sug=(Array.isArray(r.suggestions)?r.suggestions:[]).map(String).slice(0,3); useQuota("coach"); bump("coachmsg"); dayInc("coach"); }
  else { pend.t=`⚠️ Şu an cevap veremedim. ${AI_ERR[lastAiErr]||AI_ERR.failed} Tekrar gönderebilirsin; bu deneme hakkından düşülmedi.`; pend.sug=[text]; }
  state.chat=state.chat.slice(-30); save(); if(curScreen==="coach") go("coach");
}

const LABEL = `Bu fotoğraf paketli bir ürünün besin değerleri etiketini veya paketini gösteriyor. Ürün adını ve 100 g (veya 100 ml) başına değerleri etiketten oku. Etikette porsiyon ve paket gramı yazıyorsa onları da ver. Okuyamadığın değeri uydurma, null yaz. Etiket yoksa ve ürünü tanıyorsan tipik değerleri ver ve "estimated": true yap.

async function readLabel(f){
  if(!canUse("scan")) return go("limit","scan");
  thinking("Etiket okunuyor","Besin değerlerini satır satır okuyorum.");
  let r=null; try{ r=await ai(LABEL,[f],{timeout:60000}); }catch(err){ return go("today"); }
  const url=URL.createObjectURL(f);
  const manual=()=>{ labelData={product:"Paketli ürün", per:{kcal:0,p:0,c:0,s:0,f:0,salt:0}, serving:null, pack:null, manual:true, url, grams:100, type:guessType()}; go("label"); };
  if(!r) return showFail({title:"Etiket okunamadı", err:lastAiErr, url, onRetry:()=>readLabel(f), onManual:manual, manualText:"Etiketteki değerleri elle gireyim",
    onDemo:()=>{ labelData={product:"Örnek bisküvi", per:{kcal:480,p:6,c:68,s:28,f:20,salt:0.6}, serving:30, pack:150, demo:true, url, grams:30, type:guessType()}; go("label"); }});
  useQuota("scan");

const MENU = budget => `Bu bir restoran, lokanta veya kafe menüsünün fotoğrafı. Okunabilen yemek ve içecekleri listele (en fazla 15). Her biri için standart bir porsiyonun gerçekçi kalorisini ver. Mümkünse yemek adını şu listeden birebir seç: ${DB_NAMES}. Kullanıcının bu öğün için yaklaşık ${budget} kcal hakkı var. ${prefsText()} Bu hakka ve sağlığa göre en iyi 1-2 seçimi tek cümleyle öner; istersen "yarım porsiyon iste" gibi pratik bir ipucu ekle.

$("#menuIn").addEventListener("change", e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) readMenu(f); });
async function readMenu(f){
  if(!canUse("scan")) return go("limit","scan");
  const budget=Math.max(0,remaining());
  thinking("Menü okunuyor","Kalan hakkına en uygun seçenekleri buluyorum.");
  let r=null; try{ r=await ai(MENU(budget),[f],{timeout:60000}); }catch(err){ return go("today"); }

  if(!r||!Array.isArray(r.items)||!r.items.length){
    if(!r) return showFail({title:"Menü okunamadı", err:lastAiErr, url, onRetry:()=>readMenu(f),

    return showFail({title:"Menüde yemek bulamadım", err:null, url, note:"Menünün yazılarını net ve yakından çekmeyi dene.", onRetry:()=>$("#menuIn").click()});
  }
  useQuota("scan");
  const items=r.items.slice(0,15).map(i=>{ const m=matchFood(i.name); const kc = m&&m.pg ? r0(m.kcal*m.pg/100) : r0(i.kcal);

}

function planPool(cat){ return DISHES.filter(x=>dishAllowed(x) && x.tags.includes(cat) && !x.tags.includes("R") && !(cat==="k"&&x.tags.includes("t"))); }
const PLAN_SLOTS=[["Kahvaltı","k",0.25],["Öğle","m",0.35],["Akşam","m",0.30],["Ara öğün","a",0.10]];
function scoreDish(x, want){ const o=state.planOpts, pn=pantry.map(norm); let s=Math.abs(x.kcal-want)+Math.random()*50;
  if(o.budget && x.tags.includes("b")) s-=90;
  if(o.pantry && pn.length) s-=x.parts.filter(([n])=>pn.some(p=>norm(n).includes(p)||p.includes(norm(n)))).length*70;
  return s; }
function pickFor(cat, want, exclude, used){ const pool=planPool(cat).filter(x=>!exclude.has(x.name) && (used[x.name]||0)<2); return pool.map(x=>({x,s:scoreDish(x,want)})).sort((a,b)=>a.s-b.s)[0]?.x; }
function rebuildShop(){
  const agg={}; (state.plan?.days||[]).forEach(dy=>dy.meals.forEach(m=>{ const d=DISHES.find(x=>x.name===m.name); d&&d.parts.forEach(([n,g])=>{ agg[n]=(agg[n]||0)+g; }); }));
  const done=Object.fromEntries((state.shop||[]).map(x=>[x.name,x.done]));
  state.shop=Object.entries(agg).sort((a,b)=>a[0].localeCompare(b[0],"tr")).map(([name,g])=>({name,grams:r0(g),done:!!done[name]}));
}
function buildPlan(){
  const goal=target(state.profile), used={}, days=[];
  for(let d=0; d<7; d++){ const meals=[], dayUsed=new Set();
    PLAN_SLOTS.forEach(([slot,cat,share])=>{ const pick=pickFor(cat, goal*share, dayUsed, used); if(pick){ meals.push({slot,name:pick.name}); dayUsed.add(pick.name); used[pick.name]=(used[pick.name]||0)+1; } });
    days.push({meals}); }
  state.plan={created:dayKey(Date.now()), days}; rebuildShop(); save();
}

/* Akıllı hedef: en az 3 haftalık, 4+ tartı ve 14+ kayıtlı gün; kilo eğilimi doğrusal regresyonla hesaplanır, yalnızca öneri sunulur */
function adaptive(){
  const p=state.profile, ws=state.weights.filter(w=>Date.now()-w.t<56*864e5).sort((a,b)=>a.t-b.t);
  const need={need:true, weights:ws.length, span:ws.length>1?r0((ws[ws.length-1].t-ws[0].t)/864e5):0, logged:0};
  if(ws.length<4) return need;
  const t0=ws[0].t, t1=ws[ws.length-1].t, days=(t1-t0)/864e5; if(days<21) return need;
  const eats=[]; for(let d=new Date(dayKey(t0)); d.getTime()<=dayKey(t1); d.setDate(d.getDate()+1)){ const e=dayEaten(d.getTime()); if(e>0) eats.push(e); }
  need.logged=eats.length; if(eats.length<14) return need;
  const xs=ws.map(w=>(w.t-t0)/864e5), ys=ws.map(w=>w.w), mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/Math.max(1e-9,xs.reduce((a,x)=>a+(x-mx)**2,0));
  const avg=eats.reduce((a,b)=>a+b,0)/eats.length, real=avg - slope*7700;
  const sug=p.goal==="lose"?real-500:p.goal==="gain"?real+300:real, cur=target(p);
  const next=Math.max(floorKcal(p), r0((cur+Math.max(-150,Math.min(150,sug-cur)))/10)*10);
  return {need:false, real:r0(real), cur, next, ok:Math.abs(sug-cur)<100, weekly:r1(slope*7), avg:r0(avg), logged:eats.length, days:r0(days)};
}
/* Haftalık özet: kayıtsız günler başarısızlık sayılmaz; ortalamalar sadece kayıtlı günlerden */
function weekStats(off){
  let logged=0, kc=0, pr=0; const goal=target(state.profile); let near=0;
  for(let i=0;i<7;i++){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i-off*7); const e=dayEaten(d.getTime()); const ms=state.meals.filter(m=>dayKey(m.t)===d.getTime());
    if(ms.length){ logged++; kc+=e; pr+=sum(ms,"p"); if(Math.abs(e-goal)<=goal*0.15) near++; } }
  return {logged, missing:7-logged, avg:logged?r0(kc/logged):0, pro:logged?r0(pr/logged):0, near};
}
function weekReport(){
  const a=weekStats(0), b=weekStats(1);
  const line = a.logged>=5?"Harika bir istikrar! Bu hafta neredeyse her gün buradaydın 🌟": a.logged>=3?"Güzel gidiyorsun; düzenli kayıt alışkanlığı oluşuyor 🌱": a.logged>=1?"Başlangıç yaptın, bu en önemli adım 👏":"Yeni hafta, yeni sayfa. Hazır olduğunda buradayız 🤗";
  const cmp = (a.logged>=3&&b.logged>=3) ? {kcal:a.avg-b.avg, pro:a.pro-b.pro} : null;
  return {...a, line, cmp, prev:b};
}

function bodyFactor(c, p){ c=c||state.char||{}; p=p||state.profile; if(!p||!p.h||!p.w) return 1; const bmi=p.w/((p.h/100)**2);
  const pts=[[16,0.82],[18.5,0.88],[22,1],[25,1.1],[28,1.22],[32,1.36],[38,1.5]]; if(bmi<=pts[0][0]) return pts[0][1]; for(let i=1;i<pts.length;i++){ if(bmi<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return y0+(y1-y0)*(bmi-x0)/(x1-x0); } } return 1.5; }
function bodyShape(c,p){ c=c||state.char||{}; p=p||state.profile; const build=c.build||"auto"; let w=1, sh=1, hip=1, mus=0;
  if(build==="auto") w=bodyFactor(c,p); else if(build==="slim") w=0.88; else if(build==="average") w=1; else if(build==="plus") w=1.3; else if(build==="curvy"){ w=1.04; hip=1.16; } else if(build==="athletic"){ w=1.0; sh=1.14; mus=1; }
  const s=c.shape||{}, cl=v=>Math.max(-3,Math.min(3,+v||0));
  sh*=1+cl(s.shoulder)*0.05; hip*=1+cl(s.hip)*0.06; const waist=1+cl(s.waist)*0.06, limb=1+cl(s.limb)*0.08;
  const leg = (p&&p.h ? Math.max(0.88,Math.min(1.14,1+(p.h-168)/220)) : 1)*(1+cl(s.height)*0.035);
  return {w, sh, hip, mus, leg, waist, limb}; }

async function svgToPngBlob(svg, scale=3){

const MEAL_WIN=[["Kahvaltı",7,10.5],["Öğle",12,14.5],["Akşam",18,21]];
function hunger(){ const now=new Date(), h=now.getHours()+now.getMinutes()/60; const w=MEAL_WIN.find(x=>h>=x[1]&&h<x[2]); if(!w||!state.profile) return null;
  const tm=todays(); if(tm.some(m=>m.type===w[0])) return null; const last=tm.length?Math.max(...tm.map(m=>m.t)):0; if(Date.now()-last<3*3600e3) return null;
  if(state.hungerDismiss===dayKey(Date.now())+":"+w[0]) return null; return w[0]; }
function dayGet(k){ return state.counters[k+":"+dayKey(Date.now())]||0; }
function dayInc(k){ const kk=k+":"+dayKey(Date.now()); state.counters[kk]=(state.counters[kk]||0)+1; save(); }
function todayMinutes(){ const k=dayKey(Date.now()); return sum((state.acts||[]).filter(a=>dayKey(a.t)===k),"min"); }
function weekMinutes(){ const ws=weekStartDate().getTime(); return sum((state.acts||[]).filter(a=>a.t>=ws),"min"); }
function weekLoggedDays(){ const ws=weekStartDate().getTime(); return new Set(state.meals.filter(m=>m.t>=ws).map(m=>dayKey(m.t))).size; }
function weekWaterDays(){ const ws=weekStartDate().getTime(); return Object.entries(state.waterLog).filter(([k,n])=>+k>=ws&&n>=state.waterGoal).length; }
function energy(){ const tm=todays(); const w=Math.min(1,waterToday()/state.waterGoal), m=Math.min(1,tm.length/3), mv=Math.min(1,todayMinutes()/20); return r0(w*35+m*35+mv*20+(streak()>=3?10:0)); }
function moodOf(){ if(hunger()) return "aç"; const e=energy(), h=new Date().getHours(); if(h>=23||h<6) return "uykulu"; return e>=70?"enerjik":"keyifli"; }
function thought(){
  const tm=todays(), w=waterToday(), st=streak(), left=remaining(), su=state.profile&&state.profile.standup&&isPremium(), hg=hunger();
  if(hg) return su?`${hg} saati geldi, midem stand-up gösterisine başladı 🎤🍽️`:`Acıktım! ${hg} vakti, bir şeyler yiyelim mi? 🍽️`;

}

let wk=null;
SCREENS.workout = () => {
  if(!wk) return go("sport");
  const W=wk.w, st=W.steps[wk.i], next=W.steps[wk.i+1];
  const left=wk.end?Math.max(0,Math.ceil((wk.end-Date.now())/1000)):wk.left, C=2*Math.PI*80, frac=1-left/st[1];
  app.innerHTML=`<section class="stack" id="wo"><div class="row" style="align-items:center"><button class="link" id="wx" style="padding-left:0;flex:0 0 auto">‹ Çık</button><b style="flex:1;text-align:center">${W.e} ${esc(W.n)}</b><span class="small muted" style="flex:0 0 auto">${wk.i+1}/${W.steps.length}</span></div>
    <div class="stage" style="text-align:center"><div style="position:relative;z-index:1">${t3Available()?`<div class="t3host" data-t3="workout" data-pose="${t3ExAnim(st[0])}" style="height:230px;margin-bottom:8px;background:transparent"></div>`:""}
      <div class="ring2" style="width:190px;height:190px"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="14"/><circle id="wring" cx="100" cy="100" r="80" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
      <div class="mid"><div class="clock" id="wclock" style="color:#fff">${left}</div><div class="small">saniye</div></div></div>
      <h2 style="color:#fff;margin:6px 0 2px">${esc(st[0])}</h2><p class="small" style="opacity:.92;margin:0">${esc(st[2]||"")}</p></div></div>
    ${next?`<p class="small muted" style="text-align:center;margin:0">Sırada: <b>${esc(next[0])}</b></p>`:""}
    <div class="row"><button class="btn ghost" id="wprev" ${wk.i===0?"disabled":""}>‹</button><button class="btn" id="wplay">${wk.end?"⏸ Duraklat":"▶ Başlat"}</button><button class="btn ghost" id="wnext">›</button></div>
    <p class="small muted" style="margin:0">Ağrı, baş dönmesi veya nefes darlığı olursa hemen dur. Sağlık durumun varsa önce doktoruna danış.</p></section>`;
  const stepTo=i=>{ wk.i=i; wk.left=W.steps[i][1]; wk.end=wk.end?Date.now()+wk.left*1000:null; speak(W.steps[i][0]); go("workout"); };
  const finish=()=>{ clearInterval(wk.iv); const w=wk.w; wk=null; logAct("home",w.min,w.id); confetti(); toast(`🎉 ${w.n} tamamlandı!`); go("sport"); };
  clearInterval(wk.iv);
  if(wk.end) wk.iv=setInterval(()=>{ if(curScreen!=="workout"||!wk){ return; } const l=Math.max(0,Math.ceil((wk.end-Date.now())/1000)); const c=$("#wclock"), r=$("#wring"); if(c) c.textContent=l; if(r) r.style.strokeDashoffset=C*(l/W.steps[wk.i][1]);
    if(l<=0){ if(navigator.vibrate) navigator.vibrate(200); if(wk.i<W.steps.length-1) stepTo(wk.i+1); else finish(); } },250);
  on("#wo",(b)=>{
    if(b.id==="wx"){ clearInterval(wk.iv); wk=null; try{ speechSynthesis.cancel(); }catch(e){} go("sport"); }
    else if(b.id==="wplay"){ if(wk.end){ wk.left=Math.max(1,Math.ceil((wk.end-Date.now())/1000)); wk.end=null; } else { wk.end=Date.now()+wk.left*1000; if(wk.i===0&&wk.left===W.steps[0][1]) speak(W.steps[0][0]); } go("workout"); }
    else if(b.id==="wprev") stepTo(Math.max(0,wk.i-1));
    else if(b.id==="wnext"){ if(wk.i<W.steps.length-1) stepTo(wk.i+1); else finish(); }
  });
};

/* Fotoğraftan karakter */
const PHOTO_CHAR=()=>`Bu fotoğraftaki kişiyi ona benzeyen sevimli bir anime karakterine dönüştürmek için yalnızca GÖRÜNEN saç, göz, ten rengi, yüz şekli, kaş, gözlük ve sakal özelliklerini seç. Renkleri fotoğraftaki gerçek tona en yakın HEX olarak ver. Kimlik, yaş, etnik köken, kilo veya vücut hakkında yorum yapma. Saç modeli şu anahtarlardan görünüşe en yakını olsun: ${Object.entries(HSTY).map(([k,v])=>k+"="+v.n).join(", ")}. Fotoğrafta kişi yoksa "person": false yap.
Yalnızca JSON döndür: {"person":true,"presentation":"f","hair":"hime","hair_color":"#5A3825","skin_color":"#F2C9A5","eye_color":"#6B4423","face":"oval","brow":"soft","glasses":false,"beard":"none","freckles":false}
face: oval, round veya vshape. brow: soft, thick, straight veya thin.
presentation: "f" veya "m". beard: none, stubble, mustache, short, full.`;
const FREE_ALT={twin:"pony",braid:"hime",princess:"wavy",spiky:"messy",undercut:"sidepart",manbun:"sidepart",wolf:"messy",samurai:"sidepart"};
function nearest(hex, list){ const h=/^#?([0-9a-f]{6})$/i.exec(String(hex||"")); if(!h) return list[0]; const n=parseInt(h[1],16), rgb=[n>>16,(n>>8)&255,n&255]; let best=list[0],bd=1e9; list.forEach(c=>{ const m=parseInt(c.slice(1),16), r=[m>>16,(m>>8)&255,m&255]; const d=(r[0]-rgb[0])**2+(r[1]-rgb[1])**2+(r[2]-rgb[2])**2; if(d<bd){ bd=d; best=c; } }); return best; }
let photoTarget="avatar";
async function photoToChar(f){
  if(!canUse("scan")) return go("limit","scan");
  thinking("Fotoğrafından karakterin çiziliyor","Saçına, gözlerine ve tenine bakıyorum. Fotoğrafın saklanmaz.");
  let r=null; try{ r=await ai(PHOTO_CHAR(),[f],{timeout:60000}); }catch(e){ return go(photoTarget); }
  if(!r) return showFail({title:"Fotoğraf analiz edilemedi", err:lastAiErr, back:photoTarget, note:"Karakterini elle oluşturmaya devam edebilirsin.", onRetry:()=>photoToChar(f)});
  if(r.person===false) return showFail({title:"Fotoğrafta bir kişi bulamadım", err:null, back:photoTarget, note:"Yüzünün ve saçının net göründüğü bir fotoğraf dene.", onRetry:()=>$("#charPhoto").click()});
  useQuota("scan");
  const base = photoTarget==="createChar" ? (draftChar||defaultChar()) : state.char;
  const c={...base}; if(r.presentation==="f"||r.presentation==="m") c.g=r.presentation;
  let hair=HSTY[r.hair]?r.hair:(c.g==="m"?"messy":"hime"), note="";
  if(!hairOwned(hair)){ note=`“${HSTY[hair].n}” saç modeli mağazada; şimdilik en yakın ücretsiz model seçildi.`; hair=FREE_ALT[hair]||"hime"; }
  const hex=v=>/^#[0-9a-f]{6}$/i.test(String(v||""))?String(v):null;
  Object.assign(c,{hair, hairCol:hex(r.hair_color)||c.hairCol, skin:hex(r.skin_color)||c.skin, eye:hex(r.eye_color)||c.eye, beard:BEARDS.some(x=>x[0]===r.beard)?r.beard:"none", freckles:!!r.freckles, face:FACES.some(x=>x[0]===r.face)?r.face:c.face||"oval", brow:BROWS.some(x=>x[0]===r.brow)?r.brow:c.brow||"soft"});
  if(photoTarget==="createChar") draftChar=c; else { state.char=c; if(r.glasses){ const g=owned("glasses_round")||null; if(g) state.equipped.face=g.uid; } save(); syncPeople(); }
  confetti(); toast("✨ Karakterin fotoğrafına göre oluşturuldu"+(note?". "+note:"")); go(photoTarget);
}

let marketDocs=[], purchaseDocs=[], giftDocs=[], peopleDocs=[], socialLive=false;
function startSocial(){
  if(!db||socialLive) return; socialLive=true;
  db.collection("market").onSnapshot(s=>{ marketDocs=s.docs.map(d=>({uid:d.id,...d.data()})); if(["community","avatar"].includes(curScreen)) go(curScreen); }, ()=>{});
  db.collection("purchases").onSnapshot(s=>{ purchaseDocs=s.docs.map(d=>({uid:d.id,...d.data()})); reconcileSales(); }, ()=>{});
  db.collection("gifts").onSnapshot(s=>{ giftDocs=s.docs.map(d=>({uid:d.id,...d.data()})); claimGifts(); }, ()=>{});
  db.collection("people").onSnapshot(s=>{ peopleDocs=s.docs.map(d=>({uid:d.id,...d.data()})); reconcileInvites(); }, ()=>{});
  syncPeople(); startDesigns(); startNudges(); startRooms(); startChats();
}
function knownPeople(){ const m={}; peopleDocs.forEach(p=>m[p.uid]={uid:p.uid,nick:p.nick,emoji:p.emoji}); feed.forEach(f=>{ if(!m[f.uid]) m[f.uid]={uid:f.uid,nick:f.nick,emoji:f.emoji}; }); return Object.values(m).filter(p=>p.nick); }
async function syncPeople(){ if(!db||!myId||!state.profile) return; try{ await db.doc("people/"+myId).set({nick:state.profile.nick||"Misafir", emoji:state.profile.emoji||"🙂", outfit:equippedIds(), char:state.char||null, body:bodyShape().w, wk:weekStartDate().getTime(), wmin:weekMinutes(), referredBy:state.referredBy||null, updated:Date.now()}); }catch(e){} }
function myListings(){ const d=marketDocs.find(x=>x.uid===myId); return (d&&d.listings)||[]; }
async function writeListings(list){ await db.doc("market/"+myId).set({nick:state.profile.nick||"Misafir", emoji:state.profile.emoji||"🙂", listings:list.slice(0,20), updated:Date.now()}); }
async function listItem(uid, price){
  if(!db||!myId) return toast("Takas pazarı bu görünümde kullanılamıyor");
  const x=state.items.find(i=>i.uid===uid); if(!x||x.bound) return toast("Bu eşya takas edilemez");
  Object.keys(state.equipped).forEach(s=>{ if(state.equipped[s]===uid) delete state.equipped[s]; });
  try{ await writeListings([...myListings().filter(l=>l.uidItem!==uid), {lid:"l"+Date.now(), itemId:x.id, uidItem:uid, price, t:Date.now()}]); save(); toast("Pazara kondu 🏷️"); }catch(e){ toast("Pazara konamadı: bağlantı veya yetki sorunu"); }
}
async function unlistItem(uid){ try{ await writeListings(myListings().filter(l=>l.uidItem!==uid)); toast("Pazardan çekildi"); }catch(e){ toast("İşlem yapılamadı"); } }
async function buyListing(sellerUid, lid){
  const d=marketDocs.find(x=>x.uid===sellerUid), l=d&&(d.listings||[]).find(x=>x.lid===lid); if(!l) return toast("Bu ilan artık yok");
  if(state.lp<l.price) return toast("Yeterli LP yok");
  if(!await askConfirm(`${TYPE_ICON[ITEM[l.itemId].type]} ${ITEM[l.itemId].n}`,`${d.nick} kullanıcısından ${fmt(l.price)} LP karşılığında alınsın mı?`,"Satın al",false)) return;
  const mine=(purchaseDocs.find(x=>x.uid===myId)||{}).list||[];
  if(mine.some(p=>p.lid===lid)) return toast("Bunu zaten aldın");
  try{ await db.doc("purchases/"+myId).set({list:[...mine,{lid, seller:sellerUid, itemId:l.itemId, price:l.price, t:Date.now()}].slice(-100)});
    state.lp-=l.price; grantItem(l.itemId,true); bump("trade"); save(); confetti(); toast("Eşya gardırobunda! 🔁"); checkAch(); }
  catch(e){ toast("Satın alınamadı: bağlantı veya yetki sorunu"); }
}
async function reconcileSales(){

  for(const k of ["recipes","weights","chat","quests","fastLog","wheelHist","shop","items","outbox"]) if(!Array.isArray(s[k])) s[k]=[];
  for(const k of ["spend","waterLog","counters","stats","ach","seasonXp","claimed","credited","seasonClaimed"]) if(!s[k]||typeof s[k]!=="object"||Array.isArray(s[k])) s[k]={};
  if(!s.equipped||typeof s.equipped!=="object") s.equipped={};
  if(s.water && s.water.d===new Date().toDateString() && !s.waterLog[dayKey(Date.now())]) s.waterLog[dayKey(Date.now())]=num(s.water.n,0);
  delete s.water;
  s.waterGoal=Math.min(16,Math.max(4,num(s.waterGoal,8)));
  if(!Number.isFinite(s.xp)) s.xp=Math.min(300,s.meals.length*10+num(s.badges,0)*40);

  s.badges=num(s.badges,0);

async function imgToData(src, max=128){
  const img=new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=src; });
  for(const m of [max,96,72]){ const k=Math.min(1,m/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.max(1,Math.round(img.width*k)); cv.height=Math.max(1,Math.round(img.height*k)); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); const d=cv.toDataURL("image/png"); if(d.length<16000||m===72) return d; }
}
function fileToData(f){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(f); }); }

async function checkImage(dataUrl){

  let r=null; try{ r=await ai(IMG_CHECK,[f],{timeout:40000}); }catch(e){ return {ok:false,reason:"Kontrol iptal edildi"}; }

    bg.innerHTML=`<div class="modal" style="max-width:420px"><h2 style="margin-bottom:6px">✏️ Kendi baskını çiz</h2><div class="paint-wrap"><canvas id="pc" width="256" height="256" aria-label="Çizim alanı"></canvas></div>
      <div class="chips" style="margin-top:8px">${COLS.map(c=>`<button class="emo" data-pc="${c}" style="width:30px;height:30px;background:${c};border-width:3px" aria-label="Renk ${c}"></button>`).join("")}<label class="emo" style="width:30px;height:30px;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border-width:3px"><input type="color" id="pcc" style="opacity:0;width:1px;height:1px;position:absolute" aria-label="Özel renk"></label></div>

      <div class="row add" style="margin-top:8px"><input id="ptx" maxlength="12" placeholder="Yazı ekle"><button class="chip solid" id="ptxb">Yaz</button></div>
      <div class="row" style="margin-top:8px"><button class="btn sm ghost" id="pun">↶ Geri al</button><button class="btn sm ghost" id="pcl">Temizle</button></div>
      <div style="position:sticky;bottom:-20px;background:var(--surface);padding:10px 0 4px;margin-top:6px"><button class="btn" id="pok">✅ Bu baskıyı kullan</button><button class="btn ghost" id="pno" style="margin-top:8px">Vazgeç</button></div></div>`;
    document.body.appendChild(bg);
    const cv=bg.querySelector("#pc"), ctx=cv.getContext("2d"); ctx.lineCap="round"; ctx.lineJoin="round";
    if(start){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,256,256); im.src=start; }
    const snap=()=>{ hist.push(ctx.getImageData(0,0,256,256)); if(hist.length>20) hist.shift(); };
    const pos=e=>{ const r=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return [(t.clientX-r.left)*256/r.width,(t.clientY-r.top)*256/r.height]; };
    let drawing=false, last=null;
    const down=e=>{ e.preventDefault(); snap(); const p=pos(e);
      if(stamp){ ctx.globalCompositeOperation="source-over"; ctx.fillStyle=col; ctx.font=`${size*5+20}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(stamp.text,p[0],p[1]); if(stamp.once) stamp=null; return; }
      drawing=true; last=p; ctx.globalCompositeOperation=erase?"destination-out":"source-over"; ctx.strokeStyle=col; ctx.lineWidth=size; ctx.beginPath(); ctx.arc(p[0],p[1],size/2,0,7); ctx.fillStyle=col; ctx.fill(); };
    const move=e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; };
    const up=()=>{ drawing=false; };
    cv.addEventListener("pointerdown",down); cv.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
    const done=v=>{ window.removeEventListener("pointerup",up); bg.remove(); res(v); };
    bg.querySelector("#pcc").addEventListener("input",e=>{ col=e.target.value; erase=false; stamp=null; });
    bg.addEventListener("click",async e=>{ const b=e.target.closest("button"); if(!b) return;

      else if(b.dataset.er){ erase=!erase; stamp=null; b.setAttribute("aria-pressed",erase); }
      else if(b.dataset.st){ stamp={text:b.dataset.st,once:false}; erase=false; toast("Damgayı yerleştirmek için çizim alanına dokun"); }
      else if(b.id==="ptxb"){ const t=bg.querySelector("#ptx").value.trim(); if(!t) return; if(!cleanText(t)) return toast("Bu yazı uygun değil"); stamp={text:t,once:true}; ctx.fillStyle=col; toast("Yazıyı yerleştirmek için çizim alanına dokun"); }
      else if(b.id==="pun"){ const h=hist.pop(); if(h) ctx.putImageData(h,0,0); }
      else if(b.id==="pcl"){ snap(); ctx.clearRect(0,0,256,256); }
      else if(b.id==="pok"){ done(await imgToData(cv.toDataURL("image/png"),128)); }
      else if(b.id==="pno") done(null); });
  });
}

function patternLayer(p,col,torso,id){

  if(p==="dots") for(let y=150;y<262;y+=9) for(let x=44;x<160;x+=9) g+=`<circle cx="${x+((y/9)%2?4.5:0)}" cy="${y}" r="1.8" fill="${col}"/>`;
  if(p==="checks"){ for(let y=140;y<262;y+=12) g+=`<rect x="40" y="${y}" width="120" height="5" fill="${col}" opacity=".5"/>`; for(let x=40;x<160;x+=12) g+=`<rect x="${x}" y="140" width="5" height="122" fill="${col}" opacity=".5"/>`; }
  if(p==="hearts") for(let y=156;y<262;y+=14) for(let x=48;x<160;x+=14) g+=`<path d="M${x+((y/14)%2?7:0)},${y+4} l-4,-4 a2.3,2.3 0 0 1 4,-3 a2.3,2.3 0 0 1 4,3Z" fill="${col}"/>`;

}

function petGain(n){ const inst=activePet(); if(!inst) return; state.petXp=state.petXp||{}; state.petCare=state.petCare||{}; const before=petStage(inst);
  state.petXp[inst.uid]=(state.petXp[inst.uid]||0)+n; const c=state.petCare[inst.uid]||{h:70}; c.h=Math.min(100,petHappy(inst)+Math.ceil(n/2)); c.last=Date.now(); state.petCare[inst.uid]=c; save();
  const after=petStage(inst); if(after>before) setTimeout(()=>{ confetti(); toast(`🎉 ${inst.name||ITEM[inst.id].n} büyüdü: artık ${PET_STAGES[after][0]}!`); },900); }

const CONTESTS=[{k:"outfit",n:"Haftanın kombini",d:"Fotoğraf stüdyosunda en şık kombinini paylaş",go:"studio",e:"👗"},{k:"meal",n:"En renkli tabak",d:"Bir öğün kaydederken “Ekle ve paylaş”ı seç",go:"camera",e:"🥗"},{k:"pet",n:"Pet şovu",d:"Dostunu büyüt ve pet şovuna katıl",go:"petcare",e:"🐾"},{k:"design",n:"Tasarım yarışması",d:"Moda Atölyesi’nde tasarla, fotoğrafını paylaş",go:"atelier",e:"✂️"}];
function weekNo(t=Date.now()){ return Math.floor((weekStartDate().getTime()-new Date(2024,0,1).getTime())/(7*864e5)); }
function currentContest(){ return CONTESTS[weekNo()%CONTESTS.length]; }
function contestKey(k){ const c=currentContest(); return c.k===k||k==="outfit"&&c.k==="design" ? weekStartDate().getTime()+":"+c.k : null; }
function contestEntries(wk){ return allPosts().filter(p=>p.contest&&p.contest.startsWith(String(wk)+":")).map(p=>({...p,votes:likesFor(`${p.uid}:${p.id}`)})).sort((a,b)=>b.votes-a.votes||a.t-b.t); }
function checkContestWin(){ if(!myId||!feedLive) return; const last=weekStartDate().getTime()-7*864e5; state.contestWon=state.contestWon||{}; if(state.contestWon[last]) return;
  const e=contestEntries(last); if(e.length>=2&&e[0].uid===myId&&e[0].votes>0){ state.contestWon[last]=Date.now(); state.gems=(state.gems||0)+50; state.badges++; save(); setTimeout(()=>{ confetti(); toast("🏆 Geçen haftanın yarışmasını kazandın! +50 💎"); },1500); } }
const GOAL_MIN=150;
function communityGoal(){ const wk=weekStartDate().getTime(); const ppl=peopleDocs.filter(p=>p.wk===wk); const sum=ppl.reduce((a,p)=>a+(+p.wmin||0),0)+(peopleDocs.some(p=>p.uid===myId)?0:weekMinutes()); const target=Math.max(300,(ppl.length||1)*GOAL_MIN); return {sum,target,n:Math.max(1,ppl.length)}; }

async function sendNudge(to,kind){ if(!db||!myId) return toast("Bu özellik canlı bağlantı gerektirir"); if(dayGet("nudge:"+to)) return toast("Bugün bu arkadaşına zaten gönderdin"); const mine=(nudgeDocs.find(x=>x.uid===myId)||{}).list||[];
  try{ await db.doc("nudges/"+myId).set({list:[...mine,{id:"n"+Date.now(),to,kind,fromNick:state.profile.nick,t:Date.now()}].slice(-60)}); dayInc("nudge:"+to); toast(kind==="cheer"?"👏 Tebrik gönderildi":"💪 Destek gönderildi"); awardLP(3,"Arkadaşını destekledin","nudge"); }catch(e){ toast("Gönderilemedi"); } }

async function t3JoinRoom(r){ await t3LeaveRoom(); T3.sceneKind=r.kind; T3.sceneHome=r.home||null; T3.roomInfo=r; T3.chatLog=[]; T3.others={};

async function t3LeaveRoom(){ const H=T3.roomH; T3.roomH=null; Object.values(T3.others).forEach(o=>{ T3.othersG.remove(o.av); t3Dispose(o.av); }); T3.others={}; if(H){ try{ await H.leave(); }catch(e){} } }
function t3Peers(peers){ const seen=new Set(); let n=0;
  peers.forEach(p=>{ if(p.isMe) return; const pr=p.presence||{}; const uid=p.by||pr.uid; if(!uid||(state.blockedUids||[]).includes(uid)) return; if(++n>14) return; seen.add(uid);
    let o=T3.others[uid]; const cfg={c:{...defaultChar(),...(pr.ch||{})},prof:{h:+pr.h||165,w:+pr.w||60},ids:(pr.ids||[]).filter(i=>ITEM[i]),sizes:pr.sz||{},tryOn:null,live:null}; cfg.shape=bodyShape(cfg.c,cfg.prof); const key=t3Key(cfg);
    if(!o||o.key!==key){ if(o){ T3.othersG.remove(o.av); t3Dispose(o.av); } const av=t3Avatar(cfg); av.userData.uid=uid; const tag=t3Sprite(String(pr.nick||"Biri").slice(0,16),{fs:28,scale:0.00028,bg:"rgba(43,37,51,.78)",color:"#fff",screen:true}); tag.position.set(0,av.userData.totalH+0.06,0); av.add(tag); av.position.set(+pr.x||0,0,+pr.z||0); T3.othersG.add(av); o=T3.others[uid]={av,key}; }
    o.nick=pr.nick; o.tx=pr.tx!=null?+pr.tx:+pr.x||0; o.tz=pr.tz!=null?+pr.tz:+pr.z||0; o.p=pr.p||"idle"; o.ry=+pr.ry||0; o.av.userData.seatH=pr.sh||0.3; o.av.userData.bedH=pr.bh||0.38;
    if(["sit","lie","swing","sitdrink","siteat"].includes(o.p)){ o.av.position.set(+pr.x||0,0,+pr.z||0); o.av.rotation.y=o.ry; } });
  Object.keys(T3.others).forEach(u=>{ if(!seen.has(u)){ T3.othersG.remove(T3.others[u].av); t3Dispose(T3.others[u].av); delete T3.others[u]; } });

function t3OthersStep(t,dt){ if(T3.mode!=="social") return; Object.values(T3.others).forEach(o=>{ const a=o.av; const dx=o.tx-a.position.x, dz=o.tz-a.position.z, d=Math.hypot(dx,dz); let pose=o.p;

    else if(!["sit","lie","swing","sitdrink","siteat"].includes(o.p)){ let da=o.ry-a.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); a.rotation.y+=da*0.1; if(pose==="walk") pose="idle"; }

function t3NpcStep(t,dt){ (T3.npcs||[]).forEach(n=>{ const a=n.av, dx=n.tx-a.position.x, dz=n.tz-a.position.z, d=Math.hypot(dx,dz); let pose=n.pose;
  if(d>0.05){ const sp=1.2*dt; a.position.x+=dx/d*Math.min(sp,d); a.position.z+=dz/d*Math.min(sp,d); let da=Math.atan2(dx,dz)-a.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); a.rotation.y+=da*0.2; pose="walk"; }
  else if(n.cb){ const cb=n.cb; n.cb=null; cb(); }
  if(n.face&&d<=0.05){ let da=Math.atan2(n.face.x-a.position.x,n.face.z-a.position.z)-a.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); a.rotation.y+=da*0.15; }
  if(a.userData.tray) a.userData.tray.visible=!!n.carry; if(n.carry&&pose==="walk") pose="carry";
  t3Animate(a,pose==="carry"?"walk":pose,t+(a.id%5),dt,false); if(n.carry){ const R=a.userData.arms[0]; R.arm.rotation.set(-0.9,0,-0.2); R.elbow.rotation.set(-0.6,0,0); } }); }

function carSpawnNear(){ if(!T3.room||!T3.room.userData.town||!state.car||!T3.av) return; if(T3.carObj){ T3.room.remove(T3.carObj); } const c=CARS[state.car.id]; const m=carMesh(c.col,state.car.id); const a=T3.av.position; let x=a.x+1.6, z=a.z; for(const [dx,dz] of [[1.6,0],[-1.6,0],[0,1.8],[0,-1.8]]){ if(!t3Blocked(a.x+dx,a.z+dz,0.9)){ x=a.x+dx; z=a.z+dz; break; } } m.position.set(x,0,z); m.rotation.y=T3.av.rotation.y; T3.room.add(m); T3.carObj=m; T3.carSpeed=0; }

function t3DayNight(){ if(!T3.sun||!T3.room) return; const out=T3.room.userData.city||T3.room.userData.walk; const d=new Date(), h=d.getHours()+d.getMinutes()/60, day=Math.max(0,Math.min(1,Math.sin((h-6)/12*Math.PI)*1.3)), dusk=Math.max(0,1-Math.abs(h-19)/1.6)+Math.max(0,1-Math.abs(h-6.5)/1.2);
  if(!out){ T3.sun.intensity=0.85; if(T3.hemi) T3.hemi.intensity=0.42; return; }
  T3.sun.intensity=0.22+0.75*day; T3.sun.color.setRGB(1,0.86+0.08*day-0.12*Math.min(1,dusk),0.74+0.16*day-0.2*Math.min(1,dusk)); if(T3.hemi) T3.hemi.intensity=0.24+0.28*day;
  const sky=new THREE.Color(); sky.setRGB(0.18+0.44*day+0.25*Math.min(1,dusk),0.22+0.56*day+0.08*Math.min(1,dusk),0.34+0.58*day-0.05*Math.min(1,dusk)); T3.S.background=sky; if(T3.S.fog) T3.S.fog.color=sky;
  const night=day<0.25; (T3.room.userData.lamps||[]).forEach(L=>{ if(L.isLight) L.intensity=night?0.7:0; else if(L.material) L.material.color.set(night?0xFFE6B0:0xF4EEE6); }); }
